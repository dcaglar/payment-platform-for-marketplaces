spring:
  profile: "azure"
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: payment-edge-workers
runPrivilegeGrantJob: true
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090
        metricName: kube_pod_info
        query: sum(kube_statefulset_replicas{statefulset="payment-edge-cell"})
        threshold: "1"
edgeWorker:
  image:
    pullPolicy: Always
  resources:
    requests: {cpu: "1000m", memory: "1Gi"}
    limits: {cpu: "2000m", memory: "2Gi"}
  jvmOpts: >-
    -XX:+UseG1GC -XX:+AlwaysActAsServerClassMachine -XX:+UseStringDeduplication -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=60 -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=128m -XX:ThreadStackSize=512 -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=30
service:
  type: ClusterIP
  port: 8080
  portName: http
nodeSelector:
  pool: edge
redis:
  url: redis://redis-master:6379
kafka:
  bootstrapServers: kafka.payment.svc.cluster.local:9092
postgresExporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
config:
  KEYCLOAK_ISSUER_URL: "http://keycloak.payment.svc.cluster.local:8080/realms/ecommerce-platform"
  CENTRAL_DB_URL: "jdbc:postgresql://central-db-postgresql.payment.svc.cluster.local:5432/central-db?options=-c%20timezone=UTC"
  EDGE_DB_NAME: "edge-db"
  CENTRAL_DB_NAME: "central-db"
serviceMonitor:
  enabled: false
---
spring:
  profile: "local"
topologySpreadConstraints: []
runPrivilegeGrantJob: true
keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 1
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090
        metricName: kube_pod_info
        query: sum(kube_statefulset_replicas{statefulset="payment-edge-cell"})
        threshold: "1"
edgeWorker:
  image:
    pullPolicy: Always
  resources:
    requests: {cpu: "150m", memory: "500Mi"}
    limits: {memory: "500Mi"}
  jvmOpts: >-
    -XX:+UseG1GC -XX:+AlwaysActAsServerClassMachine -XX:+UseStringDeduplication -XX:MaxRAMPercentage=45 -XX:InitialRAMPercentage=45 -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=128m -XX:ThreadStackSize=512 -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=30
service:
  type: ClusterIP
  port: 8080
  portName: http
redis:
  url: redis://redis-master:6379
kafka:
  bootstrapServers: kafka.payment.svc.cluster.local:9092
config:
  KEYCLOAK_ISSUER_URL: "http://keycloak:8080/realms/ecommerce-platform"
  CENTRAL_DB_URL: "jdbc:postgresql://central-db-postgresql:5432/central-db?options=-c%20timezone=UTC"
  EDGE_DB_NAME: "edge-db"
  CENTRAL_DB_NAME: "central-db"
  # -OTEL start Tracing Configuration , do not use both micrometer and OTEL Starter.

  # ✅ OTel exporter endpoint
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://my-opentelemetry-collector.payment.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "payment-edge-workers"
  # ✅ OTel sampling
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.5"
  OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "true"
  OTEL_INSTRUMENTATION_SPRING_WEBMVC_ENABLED: "true"
  OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
  OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"
  OTEL_INSTRUMENTATION_JDBC_ENABLED: "true"
  OTEL_INSTRUMENTATION_KAFKA_ENABLED: "false"
  OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "false"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_METRIC_EXPORT_INTERVAL: "15000" # Push metrics every 15 seconds (default is 60s)
  OTEL_EXPORTER_OTLP_TIMEOUT: "10000" # 10s timeout for metric push
  # Explicitly enable all key metric instrumentation
  OTEL_INSTRUMENTATION_JVM_ENABLED: "true"
  OTEL_INSTRUMENTATION_SYSTEM_ENABLED: "true"
  OTEL_INSTRUMENTATION_SPRING_BOOT_AUTOCONFIGURE_ENABLED: "true"
  OTEL_INSTRUMENTATION_HTTP_CLIENT_ENABLED: "true"
  OTEL_INSTRUMENTATION_REDIS_ENABLED: "true"
  #
  #  # --- OpenTelemetry / Micrometer Tracing Configuration ---
  #  # Target OTel Collector endpoint for spans
  #  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://my-opentelemetry-collector.payment.svc.cluster.local:4318/v1/traces"
  #  # Sample 100% of traces for local visualization (default is 0.1 / 10%)
  #  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  #  # Enable explicit tracing for Kafka producers/consumers
  #  SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"
  #  SPRING_KAFKA_TEMPLATE_OBSERVATION_ENABLED: "true"
  #
  #  # Enable explicit tracing for Redis (Lettuce client) commands
  #  SPRING_DATA_REDIS_LETTUCE_OBSERVATION_ENABLED: "true"
serviceMonitor:
  enabled: false
---
edgeWorker:
  image:
    repository: dcaglar1987/payment-edge-workers
    tag: "latest"
serviceMonitor:
  enabled: false
  labels:
    release: prometheus-stack
runPrivilegeGrantJob: true
edgeDb:
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: Always
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: "topology.kubernetes.io/zone"
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: payment-edge-cell
