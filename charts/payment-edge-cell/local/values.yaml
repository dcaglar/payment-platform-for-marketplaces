spring:
  profile: "local"
topologySpreadConstraints: []
runPrivilegeGrantJob: true
replicaCount: 1
keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 1
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "85"
        containerName: "payment-service"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1 # Add 1 pod at a time
          periodSeconds: 45 # Wait 45s between steps to allow JIT/warmup
    scaleDown:
      # "The Patience Window": Keep pods for 5 mins after load drops.
      # Prevents killing pods during small traffic dips.
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
paymentService:
  image:
    pullPolicy: Always
  jvmOpts: >-
    -XX:+UseG1GC -XX:+AlwaysActAsServerClassMachine -XX:+UseStringDeduplication -XX:MaxRAMPercentage=45 -XX:InitialRAMPercentage=45 -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=128m -XX:ThreadStackSize=512 -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=30
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      memory: 768Mi
edgeDb:
  storage:
    size: 20Gi
  resources:
    requests: {cpu: 200m, memory: 500Mi}
    limits: {memory: 500Mi}
  args:
    - "-c"
    - "shared_preload_libraries=pg_stat_statements"
    - "-c"
    - "pg_stat_statements.track=all"
    - "-c"
    - "shared_buffers=256MB"
    - "-c"
    - "effective_cache_size=512MB"
    - "-c"
    - "work_mem=3MB"
    - "-c"
    - "maintenance_work_mem=64MB"
    - "-c"
    - "max_parallel_workers_per_gather=0"
    - "-c"
    - "max_parallel_workers=2"
    - "-c"
    - "max_worker_processes=2"
    - "-c"
    - "temp_file_limit=2GB"
    - "-c"
    - "max_connections=85"
    - "-c"
    - "fsync=on"
    - "-c"
    - "synchronous_commit=on"
ingress:
  enabled: true
  className: "nginx"
  host: ""
  appPath: "/api/v1/payments"
  appPort: 8080
  healthPath: "/healthz"
  healthPort: 9000
  annotations:
    nginx.ingress.kubernetes.io/load-balance: "ewma"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "120"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "200"
    nginx.ingress.kubernetes.io/limit-connections: "350"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # ── Snowflake Cell Router ─────────────────────────────────────────────────
    # Mirrors PublicIdCodec.kt (Base64URL, big-endian 8 bytes, no padding) and
    # SnowflakeCore.kt (NODE_SHIFT=12, NODE_MASK=31).
    #
    # Flow for POST /api/v1/payments/pi_{base64url}/authorize:
    #   1. Extract base64url token from URL path
    #   2. Re-add stripped padding + swap URL-safe chars → standard Base64
    #   3. ngx.decode_base64 → 8 raw bytes
    #   4. Parse big-endian unsigned 64-bit integer (two 32-bit halves)
    #   5. nodeId = floor(lo / 4096) % 32   [ = (id >> 12) & 0x1F ]
    #   6. Set $cell_target = payment-edge-cell-<nodeId>.payment-edge-cell-headless.payment.svc.cluster.local
    #
    # Non-matching paths (e.g. POST /api/v1/payments) fall through unchanged.
    # ─────────────────────────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($uri = "/healthz") {
        rewrite ^/healthz$ /actuator/health break;
      }
      set $cell_target "";
      access_by_lua_block {
        local uri = ngx.var.uri
        ngx.log(ngx.WARN, "[cell-router-debug] URI accessed: ", uri)

        -- Only intercept paths that carry a paymentIntentId
        local b64 = string.match(uri, "^/api/v1/payments/pi_([A-Za-z0-9_%-]+)")
        ngx.log(ngx.WARN, "[cell-router-debug] Extracted b64 match group: ", tostring(b64))

        if not b64 then
          ngx.log(ngx.WARN, "[cell-router-debug] No paymentIntentId in URI. Passing through: ", uri)
          return  -- initial POST /payments or unrelated path — pass through
        end

        -- Step 1: URL-safe Base64 → standard Base64
        b64 = string.gsub(b64, "-", "+")
        b64 = string.gsub(b64, "_", "/")
        ngx.log(ngx.WARN, "[cell-router-debug] Step 1 b64 (standard format): ", b64)

        -- Step 2: Re-add PKCS#7 padding that PublicIdCodec strips
        local pad = #b64 % 4
        ngx.log(ngx.WARN, "[cell-router-debug] Calculated padding needed: ", pad)

        if pad == 2 then b64 = b64 .. "=="
        elseif pad == 3 then b64 = b64 .. "="
        end
        ngx.log(ngx.WARN, "[cell-router-debug] Final padded standard Base64: ", b64)

        -- Step 3: Decode → 8 raw bytes (big-endian signed Long)
        local raw = ngx.decode_base64(b64)
        ngx.log(ngx.WARN, "[cell-router-debug] Base64 raw decode success: ", tostring(raw ~= nil))

        if not raw or #raw ~= 8 then
          ngx.log(ngx.WARN, "[cell-router] decode failed for uri=", uri)
          return  -- fall through to default upstream
        end

        -- Step 4: Reconstruct 64-bit integer from big-endian bytes
        --   We work in two 32-bit halves to stay within Lua 5.1 integer precision.
        --   hi = bytes[1..4],  lo = bytes[5..8]
        local b = string.byte
        local lo = b(raw,5) * 16777216   -- 0x01000000
                 + b(raw,6) * 65536      -- 0x00010000
                 + b(raw,7) * 256        -- 0x00000100
                 + b(raw,8)
        ngx.log(ngx.WARN, "[cell-router-debug] Reconstructed lo byte value: ", lo)

        -- Step 5: nodeId = (lo >> 12) & 31  (sequence=12bits, node=5bits)
        local node_id = math.floor(lo / 4096) % 32
        ngx.log(ngx.WARN, "[cell-router-debug] Extracted node_id: ", node_id)

        -- Step 6: Route to exact StatefulSet pod via headless service DNS
        ngx.var.cell_target = "payment-edge-cell-" .. node_id
          .. ".payment-edge-cell-headless.payment.svc.cluster.local:8080"
        ngx.log(ngx.WARN, "[cell-router] Target cell set: ", ngx.var.cell_target)
      }
      if ($cell_target != "") {
        proxy_pass http://$cell_target;
      }
serviceMonitor:
  enabled: false
  path: /actuator/prometheus
  interval: 15s
  scrapeTimeout: 10s
  scheme: http
  labels:
    release: prometheus-stack
service:
  type: ClusterIP
  port: 8080
  portName: http
redis:
  url: redis://redis-master:6379
kafka:
  bootstrapServers: kafka.payment.svc.cluster.local:9092
config:
  KEYCLOAK_ISSUER_URL: "http://keycloak:8080/realms/ecommerce-platform"
  EDGE_DB_URL: "jdbc:postgresql://localhost:5432/edge-db?options=-c%20timezone=UTC"
  EDGE_DB_NAME: "edge-db"
  SPRING_DATA_REDIS_URL: "redis://redis-master.payment.svc.cluster.local:6379"
  # -OTEL start Tracing Configuration , do not use both micrometer and OTEL Starter.
  # ✅ OTel exporter endpoint
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://my-opentelemetry-collector.payment.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "payment-service"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "https://eu.i.posthog.com/i/v1/traces"
  OTEL_EXPORTER_OTLP_TRACES_HEADERS: "Authorization=Bearer phc_ABquVAfZ7ZA3uYgMtd39p83633a5KBRAwTPkSFHTvWYc"
  # ✅ OTel sampling
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "true"
  OTEL_INSTRUMENTATION_SPRING_WEBMVC_ENABLED: "true"
  OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
  OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"
  OTEL_INSTRUMENTATION_JDBC_ENABLED: "false"
  OTEL_INSTRUMENTATION_KAFKA_ENABLED: "false"
  OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "false"
#
#  # --- OpenTelemetry / Micrometer Tracing Configuration ---
#  # Target OTel Collector endpoint for spans
#  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://my-opentelemetry-collector.payment.svc.cluster.local:4318/v1/traces"
#  # Sample 100% of traces for local visualization (default is 0.1 / 10%)
#  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
#  # Enable explicit tracing for Kafka producers/consumers
#  SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"
#  SPRING_KAFKA_TEMPLATE_OBSERVATION_ENABLED: "true"
#
#  # Enable explicit tracing for Redis (Lettuce client) commands
#  SPRING_DATA_REDIS_LETTUCE_OBSERVATION_ENABLED: "true"
