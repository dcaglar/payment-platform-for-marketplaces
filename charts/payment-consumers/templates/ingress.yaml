{{- if and .Values.ingress .Values.ingress.enabled -}}
{{- $fullName := include "payment-consumers.fullname" . -}}
# Balance read API (BalanceController). Plain routing: balances are central, not cell-bound,
# so none of the edge cell's Snowflake/Lua cell routing applies here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: payment
  labels:
    {{- include "payment-consumers.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.appPath | default "/api/v1/balances" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .Values.service.port | default 8080 }}
{{- end }}
