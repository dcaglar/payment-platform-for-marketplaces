{{- if and .Values.ingress .Values.ingress.enabled -}}
{{- $fullName := include "payment-consumers.fullname" . -}}
# Central APIs: balance reads (BalanceController) and account onboarding (AccountController).
# Plain routing: both are central, not cell-bound, so none of the edge cell's Snowflake/Lua cell routing applies.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: payment
  labels:
    {{- include "payment-consumers.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.appPath | default "/api/v1/balances" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .Values.service.port | default 8080 }}
          - path: {{ .Values.ingress.accountsPath | default "/api/v1/accounts" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .Values.service.port | default 8080 }}
          - path: {{ .Values.ingress.transactionsPath | default "/api/v1/transactions" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .Values.service.port | default 8080 }}
          - path: {{ .Values.ingress.txsPath | default "/api/v1/txs" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .Values.service.port | default 8080 }}
{{- end }}
