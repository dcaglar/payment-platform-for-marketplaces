server:
  port: 8080
  shutdown: graceful



spring:
  application:
    name: payment-service
  # Pool defaults for the web datasource — overrideable per environment
  # These are production-safe dwefaults; tune in application-{profile}.yml if needed
  datasource:
    edge:
      driver-class-name: org.postgresql.Driver
      pool-name: ${spring.application.name}-edge-pool
  cache:
    ttl-seconds: 3600
  account-balance:
    delta-ttl-seconds: 300
    idempotency-ttl-seconds: 86400
    snapshot-interval: PT1M
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    time-zone: UTC
  data:
    redis:
  liquibase:
    enabled: false


mybatis:
  type-aliases-package: com.dogancaglar.common.db.entity
  type-handlers-package: com.dogancaglar.common.db.typehandler

management:
  server:
    port: 9000
  health:
    probes:
      enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health"
  endpoint:
    health:
      enabled: true
      show-details: always



stripe:
  api:
    api-key: test

payments:
  id:
    epoch-millis: 1735689600000   # 2025-01-01T00:00:00Z
    region-id: 1                  # EU1

