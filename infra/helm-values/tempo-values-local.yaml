# Minimal Tempo configuration for OrbStack / Azure
tempo:
  retention: 24h
  overrides:
    defaults: null
    ingestion_rate_limit_bytes: 15000000
    ingestion_burst_size_bytes: 20000000
    max_bytes_per_trace: 50000000
  memBallastSizeMbs: 256
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1024Mi

  # Enable search because Grafana TraceQL requires it for Exemplar lookups
  search:
    enabled: true

# Use ephemeral emptyDir storage for traces instead of PersistentVolumeClaim
persistence:
  enabled: false

# Configure OTLP ingestion
traces:
  otlp:
    grpc:
      enabled: false
    http:
      enabled: true
