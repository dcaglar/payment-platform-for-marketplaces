replicaCount: 1

auth:
  adminUser: admin
  adminPassword: adminpassword

postgresql:
  enabled: true
  auth:
    username: bn_keycloak
    password: bitnami
    database: bitnami_keycloak
  # leave ports at defaults (5432). Do NOT override.

service:
  type: LoadBalancer
  ports:
    http: 8080

extraEnvVars:
  - name: KC_CACHE
    value: "local"
  - name: KC_CACHE_STACK
    value: "kubernetes"
  - name: KC_PROXY
    value: "edge"
  # Keycloak's own name, used in every URL it gives out (login page, logout, token issuer): the full service name,
  # which resolves both inside the cluster and on the Mac (OrbStack), so a browser can open the login page.
  # Tokens have issuer: http://keycloak.payment.svc.cluster.local:8080/realms/ecommerce-platform (KEYCLOAK_ISSUER_URL of the services)
  - name: KC_HOSTNAME
    value: "keycloak.payment.svc.cluster.local"
  - name: KC_HOSTNAME_PORT
    value: "8080"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  # KEYCLOAK_ADMIN and KEYCLOAK_ADMIN_PASSWORD are managed by auth.adminUser/adminPassword above.
  # Do NOT set them here — duplicate plain 'value:' conflicts with Bitnami's internal secretKeyRef.

resources:
  requests:
    memory: 512Mi
    cpu: 200m
  limits:
    memory: 1Gi

livenessProbe:
  enabled: true
  initialDelaySeconds: 300
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10

readinessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10

ingress:
  enabled: false
  ingressClassName: nginx
  pathType: Prefix
  path: "/"
  annotations:
    nginx.ingress.kubernetes.io/load-balance: "ewma"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "120"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "200"
    nginx.ingress.kubernetes.io/limit-connections: "350"