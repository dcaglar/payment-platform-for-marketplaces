mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib

resources:
  limits:
    cpu: 200m
    memory: 456Mi
  requests:
    cpu: 150m
    memory: 128Mi

presets:
  logsCollection:
    enabled: true
  kubernetesAttributes:
    enabled: true
  hostMetrics:
    enabled: false
  kubeletMetrics:
    enabled: false

# Explicitly tell Helm to create a Kubernetes Service even though we are running as a DaemonSet
service:
  enabled: true

config:
  exporters:
    otlp/jaeger:
      endpoint: "jaeger.payment.svc.cluster.local:4317"
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        exporters: [debug, otlp/jaeger]
